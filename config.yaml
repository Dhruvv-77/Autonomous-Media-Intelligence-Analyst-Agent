app:
  name: "Autonomous Media Intelligence Analyst Agent"
  timezone: "UTC"
  output_dir: "outputs"
  database_url: "sqlite:///outputs/agent.db"

run:
  max_articles: 1500
  lookback_hours: 24
  max_runtime_seconds: 900
  resume_interrupted_runs: false
  input_corpus_path: "data/news_corpus_1500.jsonl"

budget:
  max_llm_eur: 4.00
  reserve_fraction: 0.15
  currency: "EUR"
  price_table_version: "2026-q1"
  paid_provider_enabled: false
  input_cost_per_million: 0.075
  output_cost_per_million: 0.30

news:
  discovery_provider: "corpus"
  languages: ["nl", "de", "fr", "en"]
  max_results_per_query: 50
  request_timeout_seconds: 20
  max_retries: 3
  per_host_concurrency: 3
  rss_feeds:
    - "https://feeds.nos.nl/nosnieuwsalgemeen"
  respect_robots_and_source_terms: true
  allow_paywall_bypass: false

llm:
  provider: "groq"  # Uses GROQ_API_KEY from .env (lightning-fast inference)
  model: "qwen/qwen3.8-27b"
  temperature: 0
  timeout_seconds: 30
  max_retries: 2
  free_tier_only: true
  paid_fallback_enabled: false

embeddings:
  model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  clustering_threshold: 0.82
  deterministic_seed: 42

client_profile:
  client_name: "Global Logistics NV"
  brands:
    - "EuroFreight"
    - "CargoExpress"
  subsidiaries:
    - "Logistics BeNeLux BV"
    - "Logistics Deutschland GmbH"
  competitors:
    - "Maersk"
    - "DHL Group"
    - "Kuehne+Nagel"
    - "DB Schenker"
  executives:
    - name: "Jan de Vries"
      role: "Chief Executive Officer"
    - name: "Elke Schneider"
      role: "Chief Financial Officer"
  topics_include:
    - "supply chain"
    - "logistics"
    - "freight rates"
    - "port strike"
    - "customs"
  topics_exclude:
    - "sports sponsorship"
    - "celebrity gossip"
  search_terms:
    - "logistics"
    - "freight"
    - "Rotterdam port"
    - "haven staking"
  output_languages: ["nl", "de"]

privacy:
  only_profile_people_may_be_named: true
  pseudonymize_other_people: true
  infer_gdpr_article_9_categories: false
  redact_secrets_from_logs: true

crm:
  mode: "mock"
  enabled: true
  max_tasks_per_run: 5
  minimum_severity: "high"
  idempotency_enabled: true
  simulated_failure_rate: 0.10

observability:
  trace_jsonl: true
  log_llm_inputs: false
  redact_sensitive_fields: true
  record_token_usage: true
  record_cost_estimates: true
